name: Plan GitHub infra changes
on:
  pull_request:
    branches: [main]
    paths:
      - 'repos/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Log in as GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_INFRA_APP_ID }}
          private-key: ${{ secrets.GH_INFRA_PRIVATE_KEY }}
          owner: fluv

      - uses: actions/checkout@v6

      - name: Run infra plan
        run: |
          gh extension install babarot/gh-infra
          gh infra plan ./repos/
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
