name: Apply GitHub changes
on:
  push:
    branches: [main]
  # paths:
  #   - "repos/**"
  #   - "files/**"
jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: github
      deployment: true
    steps:
      - name: Log in as GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_INFRA_APP_ID }}
          private-key: ${{ secrets.GH_INFRA_PRIVATE_KEY }}
          owner: fluv
      - uses: actions/checkout@v6
      - name: Apply manifests
        run: |
          gh extension install babarot/gh-infra
          gh infra apply ./repos/ --auto-approve
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Seed README into newly-created empty repos
        # Establishes `main` on any empty repo by creating an initial README
        # via the Contents API. Without this, the first contributor to a
        # new repo would have to push directly to main (forbidden by
        # CLAUDE.md invariant 4) or open a PR with no base branch (not
        # supported by GitHub). The repo list comes from the active
        # RepositorySet manifests (repos/fluv.yaml and repos/fluv-robot.yaml)
        # so there's a single source of truth — no duplicated list.
        # Idempotent: repos with any branches are skipped; archived repos
        # (repos/fluv-archived.yaml) are deliberately excluded.
        # Emptiness is probed via the branches endpoint: it returns [] with
        # HTTP 200 on an empty repo, whereas /commits returns 409 and gh
        # prints the JSON error body to stdout, poisoning the capture.
        # On any probe failure the value is non-"0" and the repo is skipped
        # (fail-safe: never attempt to seed on a transient API error).
        run: |
          set -euo pipefail
          for manifest in repos/fluv.yaml repos/fluv-robot.yaml; do
            for repo in $(yq '.repositories[].name' "${manifest}"); do
              branches=$(gh api "repos/fluv/${repo}/branches" --jq 'length' 2>/dev/null || echo skip)
              if [ "${branches}" != "0" ]; then
                continue
              fi
              echo "Seeding fluv/${repo} with initial README"
              content=$(printf '# %s\n\nInitial commit seeded by infra-apply. Replace via PR.\n' "${repo}" | base64 -w0)
              gh api -X PUT "repos/fluv/${repo}/contents/README.md" \
                -f message="Seed initial README" \
                -f content="${content}" \
                -f branch=main
            done
          done
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
