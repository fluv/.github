name: Apply GitHub changes
on:
  push:
    branches: [main]
  # paths:
  #   - "repos/**"
  #   - "files/**"
jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: github
      deployment: true
    steps:
      - name: Log in as GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
      - run: |
          gh extension install babarot/gh-infra
          gh infra apply ./repos/ --auto-approve
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
