repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the ref you want to point at
    hooks:
      - id: check-yaml
  - repo: local
    hooks:
      - id: gh-infra-validate
        name: gh-infra (validate)
        language: system
        entry: gh infra validate
        files: ^repos/
