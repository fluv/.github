[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-receiver"
version = "1.0.0"
description = "GitHub webhook receiver that posts DeepSeek-generated PR reviews as fluv-deepseek[bot]"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT-0" }
authors = [{ name = "Douglas Gardner" }]

dependencies = [
    "aiohttp==3.14.3",
    "PyJWT==2.13.0",
    "cryptography>=41.0",
    "prometheus-client>=0.20",
]

[project.scripts]
deepseek-receiver = "deepseek_receiver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
