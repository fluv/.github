apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: asda-mcp
  owner: fluv
spec:
  visibility: private
  archived: false
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    auto_delete_head_branches: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: false
    workflow_permissions: read
    can_approve_pull_requests: true
  rulesets: []
  labels:
    # vet lifecycle
    - name: "vet:pending"
      color: FBCA04
      description: PR needs vet review before human review
    - name: "vet:complete"
      color: 0E8A16
      description: Vet complete, no blocking issues, ready for human review
    - name: "vet:skipped"
      color: C5DEF5
      description: Vet explicitly skipped with written reason
    - name: "vet:deadlock"
      color: e11d48
      description: DS and author deadlocked; needs human adjudication
    - name: "vet:helpful"
      color: 1a7f37
      description: Vet surfaced a blocker or observation that led to a code change
    # review signals
    - name: "ds:helpful"
      color: 0075ca
      description: DS review surfaced a finding worth acting on
    - name: "autonomous-ok"
      color: 0e8a16
      description: Ready to implement — no design discussion needed before opening a PR
    - name: "needs-human"
      color: d876e3
      description: Blocked on a human action; not ready for autonomous work
    - name: "review this next"
      color: 37dfb3
      description: Claude's current recommended PRs for Douglas to review
    - name: "needs-opus-design"
      color: BFD4F2
      description: Design decision deferred pending Opus-level reasoning
