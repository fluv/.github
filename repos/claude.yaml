apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: claude
  owner: fluv
spec:
  visibility: private # do not change this without approval from @zuzak
  archived: false
  features:
    issues: true
    projects: false
    wiki: false
    discussions: true
    pull_requests: true
  merge_strategy:
    auto_delete_head_branches: true
  release_immutability: false
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: false
    workflow_permissions: read
    can_approve_pull_requests: true
  rulesets: []
