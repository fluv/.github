apiVersion: gh-infra/v1
kind: RepositorySet
metadata:
  owner: fluv
defaults:
  reconcile:
    labels: additive  # create/update declared labels; never delete unlisted ones
  spec:
    labels:
      # vet lifecycle
      - name: "vet:pending"
        color: fbca04
        description: PR needs vet review before human review
      - name: "vet:complete"
        color: 0e8a16
        description: Vet complete, no blocking issues, ready for human review
      - name: "vet:skipped"
        color: c5def5
        description: Vet explicitly skipped with written reason
      - name: "vet:deadlock"
        color: e11d48
        description: DS and author deadlocked; needs human adjudication
      - name: "vet:helpful"
        color: 1a7f37
        description: Vet surfaced a blocker or observation that led to a code change
      # review signals
      - name: "ds:helpful"
        color: 0075ca
        description: DS review surfaced a finding worth acting on
      - name: "autonomous-ok"
        color: 0e8a16
        description: Ready to implement — no design discussion needed before opening a PR
      - name: "needs-human"
        color: d876e3
        description: Blocked on a human action; not ready for autonomous work
      - name: "review this next"
        color: 37dfb3
        description: Claude's current recommended PRs for Douglas to review
      - name: "needs-opus-design"
        color: bfd4f2
        description: Design decision deferred pending Opus-level reasoning
    visibility: public
    archived: false
    features:
      # issues: false
      projects: false
      wiki: false
      discussions: false
      pull_requests:
        creation: collaborators_only
    merge_strategy:
      allow_merge_commit: false
      allow_squash_merge: true
      allow_rebase_merge: true
      allow_auto_merge: true
    security:
      vulnerability_alerts: true
      automated_security_fixes: true
      private_vulnerability_reporting: false
    actions:
      enabled: true
      allowed_actions: all
      workflow_permissions: read
      can_approve_pull_requests: true
    rulesets:
      - name: branch protection
        target: branch
        enforcement: active
        bypass_actors:
          - role: admin
            bypass_mode: always
        conditions:
          ref_name:
            include:
              - ~DEFAULT_BRANCH
        rules:
          non_fast_forward: true
          deletion: true
      - name: review requirements
        target: branch
        enforcement: active
        bypass_actors:
          - role: admin
            bypass_mode: always
        conditions:
          ref_name:
            include:
              - ~DEFAULT_BRANCH
        rules:
          pull_request:
            required_approving_review_count: 2
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: false
            require_last_push_approval: true
            required_review_thread_resolution: false
repositories:
  # Human-reviewed public repos (required_approving_review_count: 2)
  - name: .github # this repo
  - name: barcodebuddy-docker
  - name: kube
  - name: mcp-grocy-api
  - name: notebook
    spec:
      description: Basic memory-extending MCP
  - name: printer-mcp
    spec:
      description: '"For the bit" optimised printer MCP server'
  - name: vestibule
    spec:
      description: Simple JSON to MCP layer
  - name: waitrose-mcp
    spec:
      description: MCP server to browse and order on Waitrose.com
