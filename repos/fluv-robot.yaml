apiVersion: gh-infra/v1
kind: RepositorySet
metadata:
  owner: fluv
defaults:
  reconcile:
    labels: additive
  spec:
    visibility: public
    archived: false
    features:
      projects: false
      wiki: false
      discussions: false
      pull_requests:
        creation: collaborators_only
    merge_strategy:
      allow_merge_commit: false
      allow_squash_merge: true
      allow_rebase_merge: true
      allow_auto_merge: true
    security:
      vulnerability_alerts: true
      automated_security_fixes: true
      private_vulnerability_reporting: false
    actions:
      enabled: true
      allowed_actions: all
      workflow_permissions: read
      can_approve_pull_requests: true
    rulesets:
      - name: branch protection
        target: branch
        enforcement: active
        bypass_actors:
          - role: admin
            bypass_mode: always
        conditions:
          ref_name:
            include:
              - ~DEFAULT_BRANCH
        rules:
          non_fast_forward: true
          deletion: true
      - name: review requirements
        target: branch
        enforcement: active
        bypass_actors:
          - role: admin
            bypass_mode: always
        conditions:
          ref_name:
            include:
              - ~DEFAULT_BRANCH
        rules:
          pull_request:
            required_approving_review_count: 1
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: false
            require_last_push_approval: true
            required_review_thread_resolution: false
repositories:
  # DS-reviewed public repos — robot approval sufficient to merge
  - name: grafana
    spec:
      description: Automatically synchronised Grafana dashboards
  - name: lgtv-exporter
    spec:
      description: Prometheus exporter for LG WebOS TVs via SSAP WebSocket
  - name: awair-exporter
    spec:
      description: Prometheus exporter for Awair Element air quality monitors
  - name: octopus-exporter
    spec:
      description: Prometheus exporter for Octopus Energy Kraken API consumption data
  - name: meaco-exporter
    spec:
      description: Prometheus exporter and local control for the Meaco Arete Two dehumidifier (Tuya)
  - name: telegram-trading
    spec:
      description: Telegram bot that trades securities based on sentiment analysis of messages
  - name: tf2-server
    spec:
      description: Team Fortress 2 dedicated server for the k3s cluster, with an LLM chat bot (!bot)
  - name: slipway
    spec:
      description: Web service that converts recorded household data into a short daily list of concrete prompts to act
